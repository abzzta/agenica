[project]
name = "agenica"
version = "0.1.0"
description = "Ms. Agenica S - ADK Executive Assistant Agent for Gemini Enterprise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.3.0",
    "google-genai>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
